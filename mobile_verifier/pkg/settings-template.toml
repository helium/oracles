
# log settings for the application (RUST_LOG format). Default below
# 
# log = "mobile-verifier=debug,poc_store=info"

# Cache location for generated verified reports; Required
cache = "/var/data/verfied-reports"

# Reward period in hours. (Default is 24)
# rewards = "24 hours"

# Verification offset in minutes, verification will occur at the end of
# the reward period + reward_offset; Default = 30 minutes
# reward_offset_minutes = "30 minutes"

# Comma-separated b58 public keys authorized to submit hotspot ban reports
# (NetworkKeyRole::Banning). Replaces the mobile-config authorization lookup.
# Required: at least one key, or the service errors on startup.
banning_authorized_keys = "key1,key2"

# How often the in-memory snapshot of known gateways is refreshed from the Trino
# inventory table (see [trino]). Default is 1 hour.
# gateway_refresh_interval = "1 hour"

# How often the last-validated-location cache is reloaded from `poc.heartbeats`.
# Default is 1 hour.
#
# Heartbeats that carry no location validation of their own inherit the hotspot's
# last validated location from this cache. It is process-local, so this reload is
# what picks up locations validated by another instance — during a rolling
# deploy, for example. Keep it well under the 24-hour location validity window.
#
# The initial load at startup is mandatory: if it fails the service refuses to
# start, rather than publishing a zero location-trust score for every hotspot
# that had asserted a location. Later reloads are best-effort and retry.
#
# location_cache_refresh_interval = "1 hour"

# Optional: mirror the rewarder's own `meta` state — `next_reward_epoch` and
# `disable_complete_data_checks_until` — to a local JSON file.
#
# Postgres remains the source of truth and serves every read; the file is written
# alongside it, at startup and after each epoch is rewarded, so a deployment can
# be kept ready for the eventual cutover off Postgres. Nothing reads the mirror
# yet. Writes go through a temp file + rename so a crash can't truncate it.
#
# `disable_complete_data_checks_until` is written as an RFC 3339 datetime rather
# than the raw epoch seconds the `meta` table stores; omitting it in a
# hand-written file means the Unix epoch, i.e. the checks always run.
#
# {"next_reward_epoch": 20321, "disable_complete_data_checks_until": "1970-01-01T00:00:00Z"}
#
# rewarder_state_file = "/var/lib/mobile-verifier/rewarder-state.json"

[database]

# Postgres Connection Information
url = "postgres://postgres:postgres@127.0.0.1:5432/mobile_verifier"

# Max connections to the database.
max_connections = 50

[ingest]

# Input bucket details for ingest data 

# Name of bucket to access ingest data. Required
#
bucket = "mainnet-mobile-ingest"

[promotion_ingest]

# Input bucket details for Service Provider Promotion Funds

# Name of bucket to access ingest data. Required
#
bucket = "price"

# Region for bucket. Defaults to below
#
# region = "us-west-2"

# Optional URL for AWS api endpoint. Inferred from aws config settings or aws
# IAM context by default
#
# endpoint = "https://aws-s3-bucket.aws.com"

[output]
# Output bucket for verified reports

# Name of bucket to write details to. Required
#
bucket = "mainnet-mobile-verified"

# Region for bucket. Defaults to below
#
# region = "us-west-2"

# Optional URL for AWS api endpoint. Inferred from aws config settings or aws
# IAM context by default
#
# endpoint = "https://aws-s3-bucket.aws.com"

[metrics]

# Endpoint for metrics. Default below
#
# endpoint = "127.0.0.1:19000"

# Trino query client. REQUIRED. Each epoch the reward pipeline recovers the HNT
# price from on-chain deployer-cap data via Trino (solana.public.dao_epoch_infos
# joined to sub_dao_epoch_infos) instead of a price feed; it also reads the
# burned data-transfer sessions that size and split the reward pool. The cluster
# must expose both the `solana` catalog (on-chain indexer DB) and the catalog
# holding data_transfer.burned_sessions.

[trino]
host = "trino.example.com"
port = 443
user = "mobile-verifier"

# Default catalog/schema for two-part `namespace.table` names (e.g.
# data_transfer.burned_sessions). Price queries use fully-qualified
# solana.public.* names and resolve regardless of these.
# catalog = "iceberg"
# schema = "data_transfer"
#
# # Use HTTPS (default false); skip TLS verification for local dev (default false).
# # secure = true
# # insecure_skip_tls_verify = false
#
# # Authentication (omit for anonymous). Pick one variant:
# #
# # [trino.auth]
# # type = "jwt_file"                    # token read from a file, refreshed periodically
# # path = "/var/run/secrets/trino.jwt"
# # refresh_interval = "60s"
# #
# # type = "jwt"                         # static token
# # token = "ey..."
# #
# # type = "basic"
# # username = "mobile-verifier"
# # password = "..."

# Iceberg catalog. REQUIRED.
#
# Heartbeats and speedtests are written here and nowhere else in a queryable
# form — Postgres no longer stores them. They are read back through Trino to warm
# the last-location and speedtest windows at startup, and to gate rewarding on
# data currency, so an unconfigured catalog leaves the rewarder unable to fire.
[iceberg_settings]
catalog_uri = "http://iceberg-catalog:8181"
catalog_name = "nova"
warehouse = "s3://warehouse-bucket/iceberg"

# [iceberg_settings.auth]
# # (optional) OAuth2 / token config

# [iceberg_settings.s3]
# region = "us-west-2"
