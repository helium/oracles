
# log settings for the application (RUST_LOG format). Default below
#
# log = "ingest=debug,poc_store=info"

# Mode to run the ingest in. This adjustst the allowed grpc endpoints.
# "mobile" or "chain". Required
mode = "mobile"

# Token for ingest grpc endpoint bearer authentication. This is required for
# "mobile" mode and ignored for iot.
#
# token = "api-token"

# Listen address for public grpc. Default below
#
# listen = "0.0.0.0:9081"

# Cache folder to use. Default blow
#
# cache = "/var/data/ingest"

# Network required by all public keys: mainnet | testnet
#
network = "mainnet"

# Comma-separated b58 public keys authorized to submit carrier-signed reports
# (NetworkKeyRole::MobileCarrier): hex usage stats, radio usage stats (v1/v2),
# and enabled carriers info. Replaces the mobile-config authorization lookup.
# Required in "mobile" mode: at least one key, or the service errors on startup.
# Ignored in "chain" mode.
carrier_authorized_keys = "key1,key2"

# HIP-150. Comma-separated b58 public keys authorized to issue data transfer
# multiplier tickets. Deliberately separate from carrier_authorized_keys, so a
# carrier key cannot grant a hotspot a reward multiplier.
#
# Unlike carrier_authorized_keys this may be empty, and defaults to empty: the
# oracle release ships before any ticket can be issued. Empty fails closed —
# every ticket is rejected — and warns at startup.
#
# data_transfer_multiplier_authorized_keys = "key1,key2"

# HIP-150. How old a ticket's signed timestamp may be before ingest refuses it.
# A signature never expires, so this is what stops a ticket captured off the
# wire from being replayed later. Defaults to 10 minutes.
#
# data_transfer_multiplier_ticket_max_age = "10 minutes"

[output]
# Output bucket for ingested data

# Name of bucket to write details to. Required
#
bucket = "ingest-bucket"

# Region for bucket. Defaults to below
#
# region = "us-west-2"

# Optional URL for AWS api endpoint. Inferred from aws config settings or aws
# IAM context by default
#
# endpoint = "https://aws-s3-bucket.aws.com"

[metrics]

# Endpoint for metrics. Default below
#
# endpoint = "127.0.0.1:19000"
