
# log settings for the application (RUST_LOG format). Default below
#
# log = "ingest=debug,poc_store=info"

# Mode to run the ingest in. This adjustst the allowed grpc endpoints.
# "mobile" or "chain". Required
mode = "mobile"

# Token for ingest grpc endpoint bearer authentication. This is required for
# "mobile" mode and ignored for iot.
#
# token = "api-token"

# Listen address for public grpc. Default below
#
# listen = "0.0.0.0:9081"

# Network required by all public keys: mainnet | testnet
#
network = "mainnet"

# Comma-separated b58 public keys authorized to submit carrier-signed reports
# (NetworkKeyRole::MobileCarrier): hex usage stats, radio usage stats (v1/v2),
# and enabled carriers info. Replaces the mobile-config authorization lookup.
# Required in "mobile" mode: at least one key, or the service errors on startup.
# Ignored in "chain" mode.
carrier_authorized_keys = "key1,key2"

# HIP-150. Comma-separated b58 public keys authorized to issue data transfer
# multiplier tickets. Deliberately separate from carrier_authorized_keys, so a
# carrier key cannot grant a hotspot a reward multiplier.
#
# Unlike carrier_authorized_keys this may be empty, and defaults to empty: the
# oracle release ships before any ticket can be issued. Empty fails closed —
# every ticket is rejected — and warns at startup.
#
# data_transfer_multiplier_authorized_keys = "key1,key2"

# HIP-150. How old a ticket's signed timestamp may be before ingest refuses it.
# A signature never expires, so this is what stops a ticket captured off the
# wire from being replayed later. Defaults to 10 minutes.
#
# A ticket stamped slightly in the future is treated as current rather than
# refused, since clients do not share a clock with ingest. That allowance is a
# constant shared with the packet verifier, not a setting: the two check
# freshness against the same timestamp and must not be configured apart.
#
# data_transfer_multiplier_ticket_max_age = "10 minutes"

[file_upload]
# Directory the file sinks write into, and under which each bucket stages its
# own <root>/<label>_<bucket>/ subdirectory. Required -- this was previously
# `cache`.
root = "/opt/ingest/data"

# Every bucket a rolled file is written to, keyed by a label you choose. At
# least one is required. Two buckets means the same file, byte for byte and
# under the same key, lands in both.
#
# The label is not the bucket name: the bucket name goes in the entry. Labels
# exist so credentials can come from the environment -- bucket names are
# hyphenated and hyphens cannot appear in an environment variable name:
#
#   INGEST__FILE_UPLOAD__BUCKETS__PRIMARY__SECRET_ACCESS_KEY=<secret>
#
# Each entry carries its own region, endpoint and credentials and inherits
# nothing from the others, which is what lets one bucket live on a different
# provider than another -- a Cloudflare R2 mirror of an S3 primary. For R2 the
# region is "auto" and the key pair is an R2 API token, not the AWS one.
#
# Set both access_key_id and secret_access_key or neither. With only one of
# them the S3 client silently ignores both and falls back to the ambient AWS
# credential chain, which cannot authenticate against R2 -- so the service
# refuses to start rather than failing every upload later.
#
# A file is removed from a bucket's directory only once that bucket has stored
# it, and each bucket retries on its own: one that is failing can neither hold
# up nor delete another's copy, and picks up its own backlog on restart.

[file_upload.buckets.primary]
bucket = "ingest-bucket"
# region = "us-west-2"

# [file_upload.buckets.mirror]
# bucket = "ingest-bucket-mirror"
# endpoint = "https://<account_id>.r2.cloudflarestorage.com"
# region = "auto"
# access_key_id = "<r2 access key id>"
# secret_access_key = "<r2 secret access key>"

[metrics]

# Endpoint for metrics. Default below
#
# endpoint = "127.0.0.1:19000"
