# log settings for the application (RUST_LOG format). Default below
#
# log = "reward_index=debug,poc_store=info"

# Key the unallocated rewards are indexed under. Default below
#
# unallocated_reward_entity_key = "not_emitted"

[database]

# Postgres Connection Information
host = "127.0.0.1"
port = 5432
username = "postgres"
database = "reward_index"

auth_type = "iam"
# IAM Role to assume to generate db auth token

iam_role_arn = "arn::iam"
iam_role_session_name = "role-session-name"
iam_duration_seconds = 900
iam_region = "us-west-2"

# Max connections to the database.
max_connections = 10

[iceberg]

# `start_period` of the first reward epoch to index from Iceberg. Earlier
# epochs are skipped; they were indexed from reward manifest files. Required
#
start_epoch_period = "2026-10-28T00:00:00Z"

# Only snapshots committed after this time are read on first start. Must be
# before the commit time of the `start_epoch_period` snapshots. Defaults to
# reading every snapshot.
#
# snapshot_start_after = "2026-10-27T00:00:00Z"

# Directory for the stream watermark dbs (mount on a PVC). Defaults to
# $ICEBERG_STREAM_DB_DIR, falling back to the current directory.
#
# db_dir = "/data"

# How often to poll for new snapshots. Default below
#
# poll_duration = "5 minutes"

[iceberg.catalog]
catalog_uri = "http://localhost:8181/api/catalog"
catalog_name = "iceberg"
warehouse = "iceberg"

[metrics]

# Endpoint for metrics. Default below
#
# endpoint = "127.0.0.1:19000"
