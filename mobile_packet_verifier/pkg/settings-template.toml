
# log settings for the application (RUST_LOG format). Default below
#
# log = "mobile_4packet_verifier=debug"

# Cache location for generated verified reports; Required

# We will burn data credits from the solana chain every `burn_period` hours.
# Default value is 1 hour.
burn_period = "1 hour"

# In case burn fails we will accelerate and burn in `min_burn_period` minutes instead of `burn_period` hours.
# Default value is 15 minutes.
min_burn_period = "15 minutes"

# If set to true, enables integration with the Solana network. This includes
# checking payer balances and burning data credits. If this is disabled, all
# payers will have a default balance of 1,000,000 data credits, and burned
# data credits will only be stored in the database. This is set to false by
# default.
enable_solana_integration = "false"

# Authorized mobile router keys. A data transfer report whose routing key is not
# in this list is rejected as InvalidRoutingKey.
#
# Comma separated list of b58 keys (required)
routing_keys = ""

# How often the in-memory snapshot of known gateways is refreshed from Trino.
# Default: 1 hour
# gateway_refresh_interval = "1 hour"

# Trino connection used to resolve gateway identities. `is_gateway_known`
# queries network.chain.mobile_hotspot_inventory over this connection.
[trino]
# Trino coordinator host. Required.
host = "localhost"
# Trino coordinator port. Required.
port = 8080
# Trino user. Required.
user = "mobile-packet-verifier"

# Catalog/schema are optional; the gateway query is fully qualified
# (network.chain.mobile_hotspot_inventory), so these are usually left unset.
# catalog = "network"
# schema = "chain"

# Connect over HTTPS. Default: false
# secure = true

# Skip TLS certificate verification. Local development only. Default: false
# insecure_skip_tls_verify = false

# Authentication. Omit the [trino.auth] table entirely for anonymous access.
# `type` selects the scheme:
#   - "jwt_file": { path, refresh_interval (default "60s") }
#   - "jwt":      { token }
#   - "basic":    { username, password }
#
# [trino.auth]
# type = "jwt_file"
# path = "/var/run/secrets/trino.jwt"
# refresh_interval = "60s"

[solana]
# Solana RPC. This may contain a secret
rpc_url = "http://localhost:8899"
# Path to the keypair used to sign data credit burn solana transactions
burn_keypair = ""
# Solana cluster to use. "devnet" or "mainnet"
cluster = "devnet"
# Public key for the Data Credits Mint
dc_mint = "dcuc8Amr83Wz27ZkQ2K9NS6r8zRpf1J6cvArEBDZDmm"
# Public key for the DNT Mint (Mobile mint)
dnt_mint = "mb1eu7TzEc71KxDpsmsKoucSSuuoGLv1drys1oP2jh6"

[database]

url = "postgresql://postgres:password@localhost:5432/postgres"

# Max connections to the database. Default below
#
# max_connections = 10

# Input bucket details for ingest data
#
[ingest]

# Name of bucket to access ingest data. Required
#
bucket = "helium-mainnet-mobile-ingest"

# Region for bucket. Defaults to below
#
region = "us-west-2"

# Optional URL for AWS api endpoint. Inferred from aws config settings or aws
# IAM context by default
#
# endpoint = "https://aws-s3-bucket.aws.com"

# Optional URL for AWS api endpoint. Inferred from aws config settings or aws
# IAM context by default
#
# endpoint = "https://aws-s3-bucket.aws.com"

[file_upload]
# Directory the file sinks write into, and under which each bucket stages its
# own <root>/<bucket>/ subdirectory. Required -- this replaces `cache`.
root = "/var/data/verified-reports"

# Every bucket a rolled file is written to, keyed by a label you choose. At
# least one is required. Two buckets means the same file, byte for byte and
# under the same key, lands in both.
#
# The label is not the bucket name -- that goes in the entry. Labels exist so
# credentials can come from the environment: bucket names are hyphenated and
# hyphens cannot appear in an environment variable name.
#
#   VERIFIER__FILE_UPLOAD__BUCKETS__PRIMARY__SECRET_ACCESS_KEY=<secret>
#
# Each entry carries its own region, endpoint and credentials and inherits
# nothing from the others, which is what lets one bucket live on a different
# provider than another -- a Cloudflare R2 mirror of an S3 primary. For R2 the
# region is "auto" and the key pair is an R2 API token, not the AWS one.
#
# Set both access_key_id and secret_access_key or neither: with only one the S3
# client silently ignores both and falls back to the ambient AWS credential
# chain, so the service refuses to start rather than failing every upload.

[file_upload.buckets.primary]
bucket = "helium-mainnet-mobile-verified"
# region = "us-west-2"

# [file_upload.buckets.mirror]
# bucket = "helium-mainnet-mobile-verified-mirror"
# endpoint = "https://<account_id>.r2.cloudflarestorage.com"
# region = "auto"
# access_key_id = "<r2 access key id>"
# secret_access_key = "<r2 secret access key>"

[metrics]

# Endpoint for metrics. Default below
#
# endpoint = "127.0.0.1:19000"

# Ban Settings
#
[banning]
# How often do we remove expired bans?
# Default: 24 hours
#
# purge_interval = "24 hour"

# How far back do we read ban files?
# Default: UNIX_EPOCH
#
# start_after = "2024-12-15 01:00:00Z"

# Verifier bucket details for ban data
#
[banning.input_bucket]

# Name of bucket to access ingest data. Required
#
bucket = "helium-mainnet-mobile-verified"

# Region for bucket. Defaults to below
#
region = "us-west-2"

# HIP-150 data transfer multiplier tickets
#
# Every ticket ruled on is written to s3 and to the append-only
# data_transfer.multiplier_ticket_history table, refusals included.
#
# Granted multipliers are also written to the data_transfer_multipliers table in
# Postgres, which is what the burn joins against when it prices sessions.
#
[multiplier]

# Comma-separated b58 public keys authorized to issue tickets.
#
# Checked here as well as at ingest: the two services are deployed and
# configured separately, and it is this verdict that lands on the record.
#
# Empty by default, which rejects every ticket and warns at startup. Nothing can
# be granted until a signer is provisioned.
#
# authorized_keys = "key1,key2"

# How old a ticket's signed timestamp may be, measured against when ingest
# received it, before it is refused. Configured separately from ingest's own
# window so that a mistake there does not widen the replay window everywhere.
# Default: 10 minutes
#
# ticket_max_age = "10 minutes"

# How far back do we read ticket files?
# Default: UNIX_EPOCH
#
# start_after = "2024-12-15 01:00:00Z"

# Ingest bucket details for data transfer multiplier tickets
#
[multiplier.input_bucket]

# Name of bucket to access ingest data. Required
#
bucket = "helium-mainnet-mobile-ingest"

# Region for bucket. Defaults to below
#
region = "us-west-2"
