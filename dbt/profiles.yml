# Connection profiles for the mobile_dbt project.
#
# `local` targets the docker-compose stack at the repo root
# (`docker compose up -d --wait trino`): Trino 480 on :8080, anonymous, over
# plain HTTP, against the `iceberg` catalog. That is also what CI uses.
#
# `prod` reads every value from the environment so nothing secret lives in the
# repo. It authenticates with HTTP Basic against a cluster serving a self-signed
# certificate; see the notes on `method` and `cert` below.
mobile_dbt:
  target: "{{ env_var('DBT_TARGET', 'local') }}"
  outputs:
    local:
      type: trino
      method: none
      host: "{{ env_var('TRINO_HOST', 'localhost') }}"
      port: "{{ env_var('TRINO_PORT', '8080') | int }}"
      user: "{{ env_var('TRINO_USER', 'dbt') }}"
      http_scheme: http
      catalog: "{{ env_var('MOBILE_CATALOG', 'iceberg') }}"
      # Fallback only. Models declare the schema they belong to (see
      # dbt_project.yml); anything that shows up here forgot to.
      schema: undeclared
      threads: 4
      # Every timestamp column in the source tables is `timestamp with time
      # zone`, and the incremental window casts a date back to one. Without a
      # fixed client zone that cast would follow whatever zone the machine
      # running dbt is in, so the same run could recompute a different window
      # on two developers' laptops. (`timezone` is a client connection
      # parameter, not a Trino session property -- setting it under
      # `session_properties` is rejected as INVALID_SESSION_PROPERTY.)
      timezone: UTC

    prod:
      type: trino
      # HTTP Basic. dbt-trino calls this method `ldap`, but the name only
      # reflects the commonest backend for Trino's PASSWORD authentication --
      # the adapter builds a `trino.auth.BasicAuthentication`, which is what
      # PASSWORD accepts however it is backed (LDAP, a password file, anything
      # else). There is no separate `basic` method.
      method: ldap
      user: "{{ env_var('TRINO_USER', 'mobile-dbt') }}"
      password: "{{ env_var('TRINO_PASSWORD') }}"
      host: "{{ env_var('TRINO_HOST') }}"
      # 8443, not 443. Railway's private network has no edge proxy and no port
      # remapping -- you reach the container on the port it actually listens on,
      # and 443 is a public-edge convention that does not apply there. This is
      # Trino's `http-server.https.port`.
      port: "{{ env_var('TRINO_PORT', '8443') | int }}"
      # No `http_scheme`: this method forces HTTPS, and Trino refuses password
      # authentication over plain HTTP -- it would be sending the password in a
      # header in the clear.
      catalog: "{{ env_var('MOBILE_CATALOG', 'mobile') }}"
      schema: "{{ env_var('DBT_SCHEMA', 'undeclared') }}"
      threads: 8
      timezone: UTC
      # The cluster serves a SELF-SIGNED certificate, so the system CA store
      # cannot validate it. Two ways to deal with that:
      #
      #   TRINO_SSL_CERT=/path/to/trino.crt   verify against that certificate.
      #                                       Only the CERTIFICATE block -- a
      #                                       client never needs the key half.
      #                                         openssl s_client -showcerts \
      #                                           -connect HOST:443 </dev/null \
      #                                           | openssl x509 -outform PEM
      #   TRINO_SSL_VERIFY=false              connect without verifying.
      #
      # Unset both and this is `true`, which fails against a self-signed
      # certificate rather than quietly downgrading. That is deliberate: pick
      # one rather than inherit one.
      #
      # WHAT TURNING IT OFF COSTS. TLS still encrypts; what is lost is any check
      # that the server is the server. This method sends the password on every
      # request, so anything able to intercept the connection and present its
      # own certificate collects that password. On a private network between two
      # services that is a small risk and skipping verification is reasonable.
      # Over a public hostname it is not -- the traffic leaves the platform and
      # the password rides on an unauthenticated channel. The deciding question
      # is which hostname TRINO_HOST names, not whether the certificate happens
      # to be self-signed.
      #
      # Rendering note, and it is fiddlier than it looks. `cert` has to reach
      # the adapter as a genuine boolean or a path, and dbt renders profile
      # values to STRINGS unless a value is marked for native typing -- which
      # only `as_bool`, `as_number` and `as_native` do. Without `as_bool` the
      # boolean branch arrives as the string "False", which requests then tries
      # to open as a CA bundle:
      #
      #   Could not find a suitable TLS CA certificate bundle,
      #   invalid path: False
      #
      # `as_bool` runs `literal_eval`, which accepts `False` and not `false`,
      # hence `lower | capitalize` ahead of it. And the certificate path must
      # NOT go through `as_bool` -- a path is not a boolean and would be
      # rejected -- hence a conditional rather than an `or`, so only the
      # boolean branch is marked.
      cert: "{{ env_var('TRINO_SSL_CERT') if env_var('TRINO_SSL_CERT', '') else (env_var('TRINO_SSL_VERIFY', 'true') | lower | capitalize | as_bool) }}"
      # Silences urllib3's InsecureRequestWarning, which fires on every request
      # when verification is off -- 96 runs a day of it drowns out the logs that
      # matter. Nothing is lost by hiding it: `wait_for_trino.py` announces
      # `TLS verification is DISABLED` once per run, which is the same fact
      # stated once instead of continuously. Harmless when verification is on,
      # since no such warning is raised then.
      suppress_cert_warning: true
