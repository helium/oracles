version: 2

# Two kinds of source, verified two different ways.
#
#   * ORACLE-WRITTEN tables (`hotspots.speedtests`): their schema is a
#     `table_definition()` function in Rust. CI creates them from that function
#     (`cargo run -p mobile-verifier --example create_dbt_sources`) before
#     building, so a declaration here is checked against what the oracle really
#     writes, and a Rust change that breaks a model fails in the same PR. A
#     table is declared here only when a model reads it; add it to that
#     example's `SOURCES` at the same time.
#   * EXTERNAL tables (`hotspots.enabled_carriers_history`): written by the S3
#     binary-file ingest pipeline OUTSIDE this repo, so there is no definition
#     to derive them from. `scripts/external_sources.sql` holds a
#     hand-maintained copy of the production DDL instead -- weaker, and the best
#     available for a table we do not own. Refresh it with `SHOW CREATE TABLE`
#     when upstream moves.
#
# `database` is the active target's catalog rather than a project var: a var
# whose value is itself Jinja (`{{ env_var(...) }}`) is not re-rendered when a
# schema YAML reads it, and lands in the query as a literal catalog name that
# does not exist. Taking it from the target also means sources and models can
# never end up pointed at different catalogs -- `iceberg` locally, `mobile` in
# production, one setting either way (see profiles.yml).
#
# Source names mirror the Iceberg namespace, so `source('hotspots',
# 'enabled_carriers_history')` names the table it reads with no translation step
# in between.

sources:
  - name: hotspots
    database: "{{ target.database }}"
    schema: hotspots
    description: >
      Hotspot state. Mixes tables mobile-verifier writes (created in CI from
      their Rust definitions) with tables the S3 binary-file ingest pipeline
      writes from outside this repo (mirrored in
      `scripts/external_sources.sql`). Each table says which it is.
    tables:
      - name: speedtests
        description: >
          ORACLE-WRITTEN by mobile-verifier
          (`mobile_verifier/src/iceberg/speedtest.rs`). Every speedtest report
          that passed validation -- in bounds, from a known non-data-only
          gateway. Rejected reports go to `invalid_speedtests` and are not
          declared here, so nothing models them.

          A HISTORY table, one row per report as received. A replayed report is
          stored again, so (hotspot_pubkey, timestamp) is NOT unique here;
          dedupe in the model.

          Two clocks: `received_timestamp` is assigned at ingest and is the
          partition key; `timestamp` is the device's own. Filter and watermark
          on the former, order a hotspot's reports by the latter.
        loaded_at_field: received_timestamp
        freshness:
          warn_after: { count: 6, period: hour }
          error_after: { count: 24, period: hour }
        columns:
          - name: hotspot_pubkey
            tests: [not_null]
          - name: serial
          - name: received_timestamp
            description: When ingest received the report. Partition key.
            tests: [not_null]
          - name: timestamp
            description: >
              Device-reported time of the speedtest. Can in principle be later
              than `received_timestamp` (a clock set forward); models drop such
              rows.
            tests: [not_null]
          - name: upload_speed
            description: Bytes per second.
            tests: [not_null]
          - name: download_speed
            description: Bytes per second.
            tests: [not_null]
          - name: latency
            description: Milliseconds.
            tests: [not_null]

      - name: heartbeat_reports
        description: >
          ORACLE-WRITTEN by mobile-verifier
          (`mobile_verifier/src/iceberg/heartbeat_report.rs`). Every wifi
          heartbeat that passed validation, as the hotspot reported it: no
          location carried forward, no fix-age filter, no score. Rejected
          heartbeats go to `invalid_heartbeat_reports` with a reason and are
          not declared here.

          A HISTORY table, one row per heartbeat, keyed by (hotspot_pubkey,
          received_timestamp). Written idempotently per ingest file, so a
          reprocessed file does not duplicate rows.

          Two clocks: `received_timestamp` is assigned at ingest and is the
          partition key; `heartbeat_timestamp` is the device's own.
        loaded_at_field: received_timestamp
        freshness:
          warn_after: { count: 6, period: hour }
          error_after: { count: 24, period: hour }
        columns:
          - name: hotspot_pubkey
            tests: [not_null]
          - name: received_timestamp
            description: When ingest received the heartbeat. Partition key.
            tests: [not_null]
          - name: heartbeat_timestamp
            description: Device-reported time of the heartbeat.
            tests: [not_null]
          - name: lat
            description: Reported latitude, degrees.
            tests: [not_null]
          - name: lon
            description: Reported longitude, degrees.
            tests: [not_null]
          - name: centered_lat
            description: >
              Center of the resolution-12 H3 cell holding (lat, lon), computed
              by the verifier since Trino has no H3 functions. Null only for a
              non-finite coordinate.
          - name: centered_lon
            description: As `centered_lat`.
          - name: location_validation_timestamp
            description: >
              When the device's location fix was validated. Null when the
              device sent none. Not filtered by age.
          - name: location_source
            description: "`asserted`, `gps`, `skyhook` or `unknown`."
            tests: [not_null]

      - name: enabled_carriers_history
        description: >
          EXTERNAL -- written by the S3 binary-file ingest pipeline outside this
          repo; the CI copy is `scripts/external_sources.sql`. Rows carry
          `file_ts` / `record_index`, the ingest file and offset, which together
          identify a row.

          History of carrier enablement per hotspot: which carriers are turned
          on, which are in demand-sampling, and the firmware that reported it.
          Partitioned on day(received_timestamp), sorted by (hotspot_pubkey,
          received_timestamp).

          A HISTORY table -- multiple rows per hotspot over time, one per
          report. Nothing here is current state; the current set is the latest
          row per `hotspot_pubkey`, and picking it is the consumer's job.

          Carries two clocks. `received_timestamp` is when ingest took the
          report and is the partition key; `timestamp` came from the reporting
          device. Bucket and order on the former.

          `mobile.hotspots.enabled_carriers_history` is the authoritative
          location for this data, and the one to build against.
        loaded_at_field: received_timestamp
        freshness:
          warn_after: { count: 6, period: hour }
          error_after: { count: 24, period: hour }
        tests:
          # `file_ts` + `record_index` is the ingest pipeline's row identity, so
          # a duplicate means a file was processed twice -- which would fan any
          # latest-row-per-hotspot model into picking an arbitrary winner.
          # INFERRED from the column pair's conventional meaning, not from a
          # stated upstream guarantee: confirm it, or drop this test.
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns: [file_ts, record_index]
        columns:
          - name: file_ts
            description: Ingest file the row came from.
            tests: [not_null]
          - name: record_index
            description: Offset of the record within that file.
            tests: [not_null]
          - name: received_timestamp
            description: When ingest received the report. Authoritative; partition key.
            tests: [not_null]
          - name: hotspot_pubkey
            tests: [not_null]
          - name: enabled_carriers
            description: >
              array(varchar). Nullable, and a null is not the same as an empty
              array: absent means the report carried no list, empty means it
              carried one with nothing in it.
          - name: sampling_enabled_carriers
            description: array(varchar). Carriers in a demand-sampling window. Nullable, as above.
          - name: firmware_version
            description: Nullable.
          - name: timestamp
            description: >
              Clock supplied by the reporting device. Not a grain, an ordering
              key, or a partition filter.
            tests: [not_null]
          - name: signer
            description: Key that signed the report.
            tests: [not_null]

  - name: chain
    database: "{{ target.database }}"
    schema: chain
    description: >
      Chain state, as icicle mirrors it from the ingest service's chain change
      reports into the `mobile` catalog.
    tables:
      - name: mobile_hotspot_history
        description: >
          WRITTEN BY icicle (`icicle/src/data/mobile_hotspot_history/output.rs`),
          an oracle in this repo; created in CI from that definition by
          `cargo run -p icicle --example create_dbt_sources`.

          An EVENT LOG, one row per chain update to a mobile hotspot -- the
          columns of `network.chain.mobile_hotspot_history` plus
          `asserted_lat` / `asserted_lon`, the center of the asserted H3 cell.
          Opens with a snapshot of every hotspot on 2025-10-30.

          Delivery is AT LEAST ONCE: a crash between commit and cleanup
          re-commits a batch, so `(file_ts, record_index)` is the identity of
          an update but is NOT unique here. Dedupe in the model.

          Two clocks: `timestamp` is when the update happened on chain and
          orders a hotspot's history; `received_timestamp` is when ingest saw
          it.
        loaded_at_field: received_timestamp
        columns:
          - name: file_ts
            tests: [not_null]
          - name: record_index
            tests: [not_null]
          - name: timestamp
            description: Chain time of the update. Partition key (day).
            tests: [not_null]
          - name: block
            tests: [not_null]
          - name: pub_key
            tests: [not_null]
          - name: asserted_hex
            description: Resolution-12 H3 cell, no `0x`. Null when unasserted.
          - name: asserted_lat
            description: Center of `asserted_hex`, degrees. Null when it is.
          - name: asserted_lon
            description: Center of `asserted_hex`, degrees. Null when it is.
          - name: device_type
            description: "`WIFI_INDOOR`, `WIFI_OUTDOOR`, `WIFI_DATA_ONLY`."
            tests: [not_null]
