  # -------------------------------------------------- offload_eligibility_history
  #
  # Rules in every test unless it says otherwise: fix at most 48 h old and
  # within 300 m, fail after 48 h below or 48 h silent. Times are UTC.
  # `offload_eligibility_rule_hours` stands in for the model's compile-time
  # read of the rules' longest limits (it would read the real seed, not the
  # fixture) and must match the fixture's rules: 48 + 48 + 1 makes a 97 h
  # window. `offload_eligibility_data_start` puts the first judged moment that
  # window after it; `settled_until` ends the interval. Heartbeats before the
  # interval are history the model reads, not judges. The boundary fixtures
  # sit exactly on the limits (48 h fix, 300 m, 2 samples, 75 Mbps), since
  # every limit is inclusive.

  - name: eligibility_heartbeat_silence_and_carried_fix
    model: offload_eligibility_history
    description: >
      First run, judged from 01-05 01:00, 97 h after the data starts: every hotspot's status starts there. hs_z has no data at all and starts failing no_heartbeats; leave the first moment out of the first run and it never appears (verified). hs_a is eligible on its 00:00 heartbeat and fix. Its 02:00 heartbeat has no fix of its own; it carries the
      00:00 fix (3 h old, 10 m) and passes, so hs_a starts eligible. Nothing
      arrives for 48 h, so at 01-07 02:00 it fails no_heartbeats, and only that:
      had the fix not carried, the 02:00 heartbeat would have opened a low run
      reaching 48 h at the same moment and `location` would be listed too
      (verified). A fresh heartbeat on 01-08 restores it. No active floor, so no
      speedtest reason.
    overrides:
      macros:
        is_incremental: false
      vars:
        offload_eligibility_rule_hours: {max_fix_age: 48, lookback: 48}
        offload_eligibility_data_start: "2027-01-01 00:00:00.000000 UTC"
        offload_eligibility_settled_until: "2027-01-09 00:00:00.000000 UTC"
    given:
      - input: ref('offload_heartbeat_rules')
        rows:
          - {effective_from: "2026-11-16", max_fix_age_hours: 48, max_distance_m: 300, max_hours_below: 48, max_hours_silent: 48}
      - input: ref('offload_speedtest_floors')
        rows:
          - {applies_to: "new", effective_from: "2026-11-17", min_download_mbps: 100, min_upload_mbps: 10, max_latency_ms: 50, min_sample_count: 2}
      - input: ref('mobile_hotspot_assertions')
        rows:
          - {pub_key: "hs_a", asserted_hex: "x", device_type: "WIFI_INDOOR", valid_from: "2026-12-01 00:00:00+00", block: 10, file_ts: 100, record_index: 0}
          - {pub_key: "hs_z", asserted_hex: "q", device_type: "WIFI_INDOOR", valid_from: "2026-12-01 00:00:00+00", block: 11, file_ts: 101, record_index: 0}
      - input: ref('heartbeat_locations')
