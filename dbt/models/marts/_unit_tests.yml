  - name: assertions_keep_timestamp_ties_with_their_block
    model: mobile_hotspot_assertions
    description: >
      First run. At one chain timestamp hs_a moves to Y (block 20) and back to
      X (block 21), listed out of block order. In block order both are
      changes, so both are written, each with its block; a reader ordering by
      (valid_from, block, ...) gives Y a period that ends the instant it
      begins and X the time after. Order by `timestamp` alone and the move
      back to X can sort first, compare equal to the day-1 X, and be lost
      (verified).
    overrides:
      macros:
        is_incremental: false
    given:
      - input: source('chain', 'mobile_hotspot_history')
        rows:
          - {file_ts: 100, record_index: 0, received_timestamp: "2026-01-01 00:00:05+00", block: 10, timestamp: "2026-01-01 00:00:00+00", pub_key: "hs_a", asserted_hex: "x", asserted_lat: 1.0, asserted_lon: 2.0, device_type: "WIFI_INDOOR"}
          - {file_ts: 200, record_index: 1, received_timestamp: "2026-01-02 00:00:05+00", block: 21, timestamp: "2026-01-02 00:00:00+00", pub_key: "hs_a", asserted_hex: "x", asserted_lat: 1.0, asserted_lon: 2.0, device_type: "WIFI_INDOOR"}
          - {file_ts: 200, record_index: 0, received_timestamp: "2026-01-02 00:00:05+00", block: 20, timestamp: "2026-01-02 00:00:00+00", pub_key: "hs_a", asserted_hex: "y", asserted_lat: 3.0, asserted_lon: 4.0, device_type: "WIFI_INDOOR"}
    expect:
      rows:
        - {pub_key: "hs_a", asserted_hex: "x", asserted_lat: 1.0, asserted_lon: 2.0, device_type: "WIFI_INDOOR", valid_from: "2026-01-01 00:00:00+00", block: 10, file_ts: 100, record_index: 0}
        - {pub_key: "hs_a", asserted_hex: "y", asserted_lat: 3.0, asserted_lon: 4.0, device_type: "WIFI_INDOOR", valid_from: "2026-01-02 00:00:00+00", block: 20, file_ts: 200, record_index: 0}
        - {pub_key: "hs_a", asserted_hex: "x", asserted_lat: 1.0, asserted_lon: 2.0, device_type: "WIFI_INDOOR", valid_from: "2026-01-02 00:00:00+00", block: 21, file_ts: 200, record_index: 1}

  - name: assertions_append_only_what_is_new
    model: mobile_hotspot_assertions
    description: >
      THE APPEND-ONLY GUARD. `this` holds hs_a at X (from day 1) and hs_b at Z
      (from day 2); the watermark is day 2's update, received 00:00:05, so a
      30-minute lookback re-reads from 23:30:05 on day 1.

        * hs_a's day-2 update renames it at X: compared against the seed X, it
          writes no row. Its day-3 move to Y is new and is appended.
        * hs_a's day-1 update is redelivered: it sorts at the seed, not after
          it, so it is not considered and X is not written twice.
        * hs_b's day-2 update is re-read by the lookback: it IS the seed, so
          nothing is written. Its out-of-order day-1 update to W sorts before
          the seed and is ignored (the documented cost of append-only).
        * hs_c has no rows here: its first update is its first assertion.

      Without the seed, hs_a's rename and hs_b's re-read update would each be
      written again as a hotspot's first row.
    overrides:
      macros:
        is_incremental: true
      vars:
        mobile_hotspot_assertions_watermark: "2026-01-02 00:00:05.000000 UTC"
    given:
      - input: this
        rows:
          - {pub_key: "hs_a", asserted_hex: "x", asserted_lat: 1.0, asserted_lon: 2.0, device_type: "WIFI_INDOOR", valid_from: "2026-01-01 00:00:00+00", block: 10, file_ts: 100, record_index: 0, received_timestamp: "2026-01-01 00:00:05+00"}
          - {pub_key: "hs_b", asserted_hex: "z", asserted_lat: 5.0, asserted_lon: 6.0, device_type: "WIFI_OUTDOOR", valid_from: "2026-01-02 00:00:00+00", block: 20, file_ts: 200, record_index: 1, received_timestamp: "2026-01-02 00:00:05+00"}
      - input: source('chain', 'mobile_hotspot_history')
        rows:
          - {file_ts: 100, record_index: 0, received_timestamp: "2026-01-02 00:00:06+00", block: 10, timestamp: "2026-01-01 00:00:00+00", pub_key: "hs_a", asserted_hex: "x", asserted_lat: 1.0, asserted_lon: 2.0, device_type: "WIFI_INDOOR"}
          - {file_ts: 200, record_index: 0, received_timestamp: "2026-01-02 00:00:05+00", block: 20, timestamp: "2026-01-02 00:00:00+00", pub_key: "hs_a", asserted_hex: "x", asserted_lat: 1.0, asserted_lon: 2.0, device_type: "WIFI_INDOOR"}
          - {file_ts: 300, record_index: 0, received_timestamp: "2026-01-03 00:00:05+00", block: 30, timestamp: "2026-01-03 00:00:00+00", pub_key: "hs_a", asserted_hex: "y", asserted_lat: 3.0, asserted_lon: 4.0, device_type: "WIFI_INDOOR"}
          - {file_ts: 200, record_index: 1, received_timestamp: "2026-01-02 00:00:05+00", block: 20, timestamp: "2026-01-02 00:00:00+00", pub_key: "hs_b", asserted_hex: "z", asserted_lat: 5.0, asserted_lon: 6.0, device_type: "WIFI_OUTDOOR"}
          - {file_ts: 300, record_index: 1, received_timestamp: "2026-01-03 00:00:05+00", block: 15, timestamp: "2026-01-01 00:00:00+00", pub_key: "hs_b", asserted_hex: "w", asserted_lat: 7.0, asserted_lon: 8.0, device_type: "WIFI_OUTDOOR"}
          - {file_ts: 300, record_index: 2, received_timestamp: "2026-01-03 00:00:05+00", block: 30, timestamp: "2026-01-03 00:00:00+00", pub_key: "hs_c", asserted_hex: "v", asserted_lat: 9.0, asserted_lon: 9.5, device_type: "WIFI_INDOOR"}
    expect:
