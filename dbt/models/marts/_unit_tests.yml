# Unit tests, not data tests. These assert the model's LOGIC against rows
# supplied inline, so they need no fixtures and no warehouse data -- they run
# green against a freshly created, empty warehouse, in CI, on every PR. The
# fixtures in `scripts/fixtures.sql` are for looking at the thing by hand; these
# are what stop the logic regressing.
#
# `select *` in the model means every column has to be spelled out in `given`
# and `expect`. Verbose, and the price of the model tracking its source's
# columns automatically.
#
# RUN THESE WITH `dbt run && dbt test`, NOT `dbt build`. A unit test that
# supplies `this` -- which testing an incremental branch requires -- makes dbt
# read the model relation's column types to build the fixture CTE, so the
# relation has to exist. `dbt build` deliberately runs unit tests BEFORE the
# model they cover, so against a fresh warehouse it errors with "the relation
# doesn't exist" and skips everything downstream. Building first and testing
# second sidesteps it; CI does exactly that.

unit_tests:
  - name: latest_report_per_hotspot_wins
    model: enabled_carriers_inventory
    description: >
      Two reports for one hotspot: the later device `timestamp` wins and only
      that row survives. Covers the first-run branch, where the window
      predicate is `true`.
    overrides:
      macros:
        is_incremental: false
    given:
      - input: source('hotspots', 'enabled_carriers_history')
        rows:
          - {file_ts: 100, record_index: 0, received_timestamp: "2026-09-07 10:00:00+00", hotspot_pubkey: "hs_a", enabled_carriers: null, sampling_enabled_carriers: null, firmware_version: "2.18.0", timestamp: "2026-09-07 09:59:00+00", signer: "s1"}
          - {file_ts: 100, record_index: 1, received_timestamp: "2026-09-07 10:05:00+00", hotspot_pubkey: "hs_a", enabled_carriers: null, sampling_enabled_carriers: null, firmware_version: "2.19.0", timestamp: "2026-09-07 10:04:00+00", signer: "s1"}
    expect:
      rows:
          - {file_ts: 100, record_index: 1, received_timestamp: "2026-09-07 10:05:00+00", hotspot_pubkey: "hs_a", enabled_carriers: null, sampling_enabled_carriers: null, firmware_version: "2.19.0", timestamp: "2026-09-07 10:04:00+00", signer: "s1"}

  - name: watermark_ignores_reported_clock
    model: enabled_carriers_inventory
    description: >
      THE REGRESSION GUARD. A watermark over the device-supplied `timestamp`
      gets pinned by any device reporting a far-future clock and then admits
      nothing ever again, for any hotspot.

      The pin lives in the TARGET table, not the source: the watermark is
      `max(...) from {{ this }}`, so the bug only manifests once a previous run
      has already ingested the skewed row. `this` therefore holds hs_skew, whose
      device clock reads 2099 and which was received at 10:25.

        * Under `received_timestamp` the watermark is 10:25 and a 30-minute
          lookback opens the window at 09:55. hs_old (received 09:00) is
          excluded, which proves the window bounds anything at all; hs_honest
          (received 10:30) is admitted.
        * Under `timestamp` the watermark is 2099-01-01, the window opens in
          2098, and NOTHING is ever admitted again.

      Switch the model's window back to `timestamp` and this test fails with an
      empty result -- verified by doing exactly that.
    overrides:
      macros:
        is_incremental: true
    given:
      # A previous run already ingested the skewed row. This is what pins a
      # `timestamp`-based watermark.
      - input: this
        rows:
          - {file_ts: 200, record_index: 1, received_timestamp: "2026-09-07 10:25:00+00", hotspot_pubkey: "hs_skew", enabled_carriers: null, sampling_enabled_carriers: null, firmware_version: "2.18.0", timestamp: "2099-01-01 00:00:00+00", signer: "s1"}
      - input: source('hotspots', 'enabled_carriers_history')
        rows:
          - {file_ts: 200, record_index: 0, received_timestamp: "2026-09-07 09:00:00+00", hotspot_pubkey: "hs_old", enabled_carriers: null, sampling_enabled_carriers: null, firmware_version: "2.18.0", timestamp: "2026-09-07 08:59:00+00", signer: "s1"}
          - {file_ts: 200, record_index: 1, received_timestamp: "2026-09-07 10:25:00+00", hotspot_pubkey: "hs_skew", enabled_carriers: null, sampling_enabled_carriers: null, firmware_version: "2.18.0", timestamp: "2099-01-01 00:00:00+00", signer: "s1"}
          - {file_ts: 200, record_index: 2, received_timestamp: "2026-09-07 10:30:00+00", hotspot_pubkey: "hs_honest", enabled_carriers: null, sampling_enabled_carriers: null, firmware_version: "2.18.0", timestamp: "2026-09-07 10:29:00+00", signer: "s1"}
    expect:
      rows:
          - {file_ts: 200, record_index: 1, received_timestamp: "2026-09-07 10:25:00+00", hotspot_pubkey: "hs_skew", enabled_carriers: null, sampling_enabled_carriers: null, firmware_version: "2.18.0", timestamp: "2099-01-01 00:00:00+00", signer: "s1"}
          - {file_ts: 200, record_index: 2, received_timestamp: "2026-09-07 10:30:00+00", hotspot_pubkey: "hs_honest", enabled_carriers: null, sampling_enabled_carriers: null, firmware_version: "2.18.0", timestamp: "2026-09-07 10:29:00+00", signer: "s1"}

  # ── speedtest_averages ───────────────────────────────────────────────────────
  # Inputs list only the columns the model reads (`serial` is left out), and
  # most expectations only the columns under test. The fixture timestamps are
  # arbitrary; only their spacing matters.

  - name: speedtest_window_lapse_is_inclusive
    model: speedtest_averages
    description: >
      The window reaches back exactly `window_hours` (48), inclusive. B sits
      48h after A, so B averages A and B; C sits 49h after A, so A drops out.
      Latency (10 + 21) / 2 also pins integer truncation: 15, not 15.5.
    overrides:
      macros:
        is_incremental: false
      vars:
        speedtest_averages_start: "2024-01-01"
    given:
      - input: source('hotspots', 'speedtests')
        rows:
          - {hotspot_pubkey: "hs_a", received_timestamp: "2024-01-01 00:00:00+00", timestamp: "2024-01-01 00:00:00+00", upload_speed: 10, download_speed: 100, latency: 10}
          - {hotspot_pubkey: "hs_a", received_timestamp: "2024-01-03 00:00:00+00", timestamp: "2024-01-03 00:00:00+00", upload_speed: 20, download_speed: 200, latency: 21}
          - {hotspot_pubkey: "hs_a", received_timestamp: "2024-01-03 01:00:00+00", timestamp: "2024-01-03 01:00:00+00", upload_speed: 30, download_speed: 300, latency: 30}
    expect:
      rows:
        - {hotspot_pubkey: "hs_a", timestamp: "2024-01-01 00:00:00+00", upload_speed_avg_bps: 10, download_speed_avg_bps: 100, latency_avg_ms: 10, sample_count: 1}
        - {hotspot_pubkey: "hs_a", timestamp: "2024-01-03 00:00:00+00", upload_speed_avg_bps: 15, download_speed_avg_bps: 150, latency_avg_ms: 15, sample_count: 2}
        - {hotspot_pubkey: "hs_a", timestamp: "2024-01-03 01:00:00+00", upload_speed_avg_bps: 25, download_speed_avg_bps: 250, latency_avg_ms: 25, sample_count: 2}

  - name: speedtest_window_is_capped_at_max_samples
    model: speedtest_averages
    description: >
      Seven hourly reports, values 1..7. Each averages itself and what preceded
      it, until the seventh, which keeps only the newest six (2..7) -- 27 / 6
      truncated to 4, with a sample_count of 6.
    overrides:
      macros:
        is_incremental: false
      vars:
        speedtest_averages_start: "2024-01-01"
    given:
      - input: source('hotspots', 'speedtests')
        rows:
          - {hotspot_pubkey: "hs_a", received_timestamp: "2024-01-01 01:00:00+00", timestamp: "2024-01-01 01:00:00+00", upload_speed: 1, download_speed: 1, latency: 1}
          - {hotspot_pubkey: "hs_a", received_timestamp: "2024-01-01 02:00:00+00", timestamp: "2024-01-01 02:00:00+00", upload_speed: 2, download_speed: 2, latency: 2}
          - {hotspot_pubkey: "hs_a", received_timestamp: "2024-01-01 03:00:00+00", timestamp: "2024-01-01 03:00:00+00", upload_speed: 3, download_speed: 3, latency: 3}
          - {hotspot_pubkey: "hs_a", received_timestamp: "2024-01-01 04:00:00+00", timestamp: "2024-01-01 04:00:00+00", upload_speed: 4, download_speed: 4, latency: 4}
          - {hotspot_pubkey: "hs_a", received_timestamp: "2024-01-01 05:00:00+00", timestamp: "2024-01-01 05:00:00+00", upload_speed: 5, download_speed: 5, latency: 5}
          - {hotspot_pubkey: "hs_a", received_timestamp: "2024-01-01 06:00:00+00", timestamp: "2024-01-01 06:00:00+00", upload_speed: 6, download_speed: 6, latency: 6}
          - {hotspot_pubkey: "hs_a", received_timestamp: "2024-01-01 07:00:00+00", timestamp: "2024-01-01 07:00:00+00", upload_speed: 7, download_speed: 7, latency: 7}
    expect:
      rows:
        - {hotspot_pubkey: "hs_a", timestamp: "2024-01-01 01:00:00+00", upload_speed_avg_bps: 1, sample_count: 1}
        - {hotspot_pubkey: "hs_a", timestamp: "2024-01-01 02:00:00+00", upload_speed_avg_bps: 1, sample_count: 2}
        - {hotspot_pubkey: "hs_a", timestamp: "2024-01-01 03:00:00+00", upload_speed_avg_bps: 2, sample_count: 3}
        - {hotspot_pubkey: "hs_a", timestamp: "2024-01-01 04:00:00+00", upload_speed_avg_bps: 2, sample_count: 4}
        - {hotspot_pubkey: "hs_a", timestamp: "2024-01-01 05:00:00+00", upload_speed_avg_bps: 3, sample_count: 5}
        - {hotspot_pubkey: "hs_a", timestamp: "2024-01-01 06:00:00+00", upload_speed_avg_bps: 3, sample_count: 6}
        - {hotspot_pubkey: "hs_a", timestamp: "2024-01-01 07:00:00+00", upload_speed_avg_bps: 4, sample_count: 6}

  - name: speedtest_duplicates_future_dates_and_hotspots
    model: speedtest_averages
    description: >
      Three rules at once. hs_a's 10:00 report was stored twice; the earliest
      received copy (10) wins and is counted once -- the replay's 99s never
      show up. hs_a's 11:00 report was received at 10:30, so its device clock is
      ahead: it is dropped, neither a report nor a sample. hs_b's report is
      averaged on its own, untouched by hs_a's.
    overrides:
      macros:
        is_incremental: false
      vars:
        speedtest_averages_start: "2024-01-01"
    given:
      - input: source('hotspots', 'speedtests')
        rows:
          - {hotspot_pubkey: "hs_a", received_timestamp: "2024-01-01 10:00:00+00", timestamp: "2024-01-01 10:00:00+00", upload_speed: 10, download_speed: 10, latency: 10}
          - {hotspot_pubkey: "hs_a", received_timestamp: "2024-01-01 10:05:00+00", timestamp: "2024-01-01 10:00:00+00", upload_speed: 99, download_speed: 99, latency: 99}
          - {hotspot_pubkey: "hs_a", received_timestamp: "2024-01-01 10:30:00+00", timestamp: "2024-01-01 11:00:00+00", upload_speed: 50, download_speed: 50, latency: 50}
          - {hotspot_pubkey: "hs_b", received_timestamp: "2024-01-01 10:30:00+00", timestamp: "2024-01-01 10:30:00+00", upload_speed: 40, download_speed: 40, latency: 40}
    expect:
      rows:
        - {hotspot_pubkey: "hs_a", timestamp: "2024-01-01 10:00:00+00", upload_speed_avg_bps: 10, download_speed_avg_bps: 10, latency_avg_ms: 10, sample_count: 1}
        - {hotspot_pubkey: "hs_b", timestamp: "2024-01-01 10:30:00+00", upload_speed_avg_bps: 40, download_speed_avg_bps: 40, latency_avg_ms: 40, sample_count: 1}

  - name: speedtest_runs_append_only_new_reports
    model: speedtest_averages
    description: >
      The incremental branch, and the guard on append-only. The table's newest
      report is hs_c's at 14:00, so the watermark is 14:00 and a 30-minute
      lookback admits reports received from 13:30.

      The watermark is supplied as a var because the model reads it with
      `run_query` at compile time, which a unit test cannot point at a `this`
      fixture; a local `dbt run` twice over exercises the real lookup.

        * L is late: device time 09:00, received 14:10. It is new, so it gets
          its own average over P and L.
        * Q (12:00) was averaged before L arrived, over P and Q. L belongs in
          Q's window, but Q already has a row and rows are never rewritten, so
          Q is not emitted again -- as in the oracle.
        * hs_c's 14:00 report is inside the lookback but already has a row, so
          it is not emitted either. Emitting it would re-insert a row the
          table already holds (verified by dropping the `already_averaged`
          anti-join).
    overrides:
      macros:
        is_incremental: true
      vars:
        speedtest_averages_start: "2024-01-01"
        speedtest_averages_watermark: "2024-01-01 14:00:00.000000 UTC"
    given:
      # What a previous run left, consistent with the watermark above. The
      # model reads it to skip reports that already have an average.
      - input: this
        rows:
          - {hotspot_pubkey: "hs_a", timestamp: "2024-01-01 06:00:00+00", upload_speed_avg_bps: 10, download_speed_avg_bps: 10, latency_avg_ms: 10, sample_count: 1}
          - {hotspot_pubkey: "hs_a", timestamp: "2024-01-01 12:00:00+00", upload_speed_avg_bps: 20, download_speed_avg_bps: 20, latency_avg_ms: 20, sample_count: 2}
          - {hotspot_pubkey: "hs_c", timestamp: "2024-01-01 14:00:00+00", upload_speed_avg_bps: 70, download_speed_avg_bps: 70, latency_avg_ms: 70, sample_count: 1}
      - input: source('hotspots', 'speedtests')
        rows:
          - {hotspot_pubkey: "hs_a", received_timestamp: "2024-01-01 06:00:00+00", timestamp: "2024-01-01 06:00:00+00", upload_speed: 10, download_speed: 10, latency: 10}
          - {hotspot_pubkey: "hs_a", received_timestamp: "2024-01-01 12:00:00+00", timestamp: "2024-01-01 12:00:00+00", upload_speed: 30, download_speed: 30, latency: 30}
          - {hotspot_pubkey: "hs_a", received_timestamp: "2024-01-01 14:10:00+00", timestamp: "2024-01-01 09:00:00+00", upload_speed: 20, download_speed: 20, latency: 20}
          - {hotspot_pubkey: "hs_c", received_timestamp: "2024-01-01 14:00:00+00", timestamp: "2024-01-01 14:00:00+00", upload_speed: 70, download_speed: 70, latency: 70}
    expect:
      rows:
        - {hotspot_pubkey: "hs_a", timestamp: "2024-01-01 09:00:00+00", upload_speed_avg_bps: 15, sample_count: 2}

  - name: speedtest_averages_start_at_the_start_date
    model: speedtest_averages
    description: >
      With the start at 2024-01-02, A (01-01 12:00) gets no average of its
      own, but it is still a sample: B (01-02 06:00) averages A and B, a full
      window, not B alone. Cut the samples at the start date too and B
      averages only itself (verified).
    overrides:
      macros:
        is_incremental: false
      vars:
        speedtest_averages_start: "2024-01-02"
    given:
      - input: source('hotspots', 'speedtests')
        rows:
          - {hotspot_pubkey: "hs_a", received_timestamp: "2024-01-01 12:00:00+00", timestamp: "2024-01-01 12:00:00+00", upload_speed: 10, download_speed: 100, latency: 10}
          - {hotspot_pubkey: "hs_a", received_timestamp: "2024-01-02 06:00:00+00", timestamp: "2024-01-02 06:00:00+00", upload_speed: 30, download_speed: 300, latency: 30}
    expect:
      rows:
        - {hotspot_pubkey: "hs_a", timestamp: "2024-01-02 06:00:00+00", upload_speed_avg_bps: 20, download_speed_avg_bps: 200, latency_avg_ms: 20, sample_count: 2}

  - name: speedtest_samples_are_listed_newest_first
    model: speedtest_averages
    description: >
      The `speedtests` array carries each sample's own values and timestamp,
      newest first, so its first element is the report the row is for.
    overrides:
      macros:
        is_incremental: false
      vars:
        speedtest_averages_start: "2024-01-01"
    given:
      - input: source('hotspots', 'speedtests')
        rows:
          - {hotspot_pubkey: "hs_a", received_timestamp: "2024-01-01 01:00:00+00", timestamp: "2024-01-01 01:00:00+00", upload_speed: 1, download_speed: 10, latency: 100}
          - {hotspot_pubkey: "hs_a", received_timestamp: "2024-01-01 02:00:00+00", timestamp: "2024-01-01 02:00:00+00", upload_speed: 3, download_speed: 30, latency: 300}
    expect:
      format: sql
      rows: |
        select
          'hs_a' as hotspot_pubkey,
          timestamp '2024-01-01 01:00:00 UTC' as "timestamp",
          cast(1 as bigint) as upload_speed_avg_bps,
          cast(10 as bigint) as download_speed_avg_bps,
          cast(100 as bigint) as latency_avg_ms,
          cast(1 as bigint) as sample_count,
          array[
            cast(row(1, 10, 100, timestamp '2024-01-01 01:00:00 UTC')
              as row(upload_speed_bps bigint, download_speed_bps bigint, latency_ms bigint, "timestamp" timestamp(6) with time zone))
          ] as speedtests
        union all
        select
          'hs_a',
          timestamp '2024-01-01 02:00:00 UTC',
          cast(2 as bigint),
          cast(20 as bigint),
          cast(200 as bigint),
          cast(2 as bigint),
          array[
            cast(row(3, 30, 300, timestamp '2024-01-01 02:00:00 UTC')
              as row(upload_speed_bps bigint, download_speed_bps bigint, latency_ms bigint, "timestamp" timestamp(6) with time zone)),
            cast(row(1, 10, 100, timestamp '2024-01-01 01:00:00 UTC')
              as row(upload_speed_bps bigint, download_speed_bps bigint, latency_ms bigint, "timestamp" timestamp(6) with time zone))
          ]

  # ---------------------------------------------------- mobile_hotspot_assertions
  #
  # Only the columns the model reads are given; the rest of the source row is
  # null. Expectations leave out `received_timestamp`, which is carried through
  # untouched.

  - name: assertions_fold_non_location_changes
    model: mobile_hotspot_assertions
    description: >
      First run. hs_a is asserted at X, renamed (same hex, a new serial), then
      moved to Y: two rows, the rename starts none. hs_b's single row is its
      own and does not touch hs_a's.
    overrides:
      macros:
        is_incremental: false
    given:
      - input: source('chain', 'mobile_hotspot_history')
        rows:
          - {file_ts: 100, record_index: 0, received_timestamp: "2026-01-01 00:00:05+00", block: 10, timestamp: "2026-01-01 00:00:00+00", pub_key: "hs_a", asserted_hex: "x", asserted_lat: 1.0, asserted_lon: 2.0, device_type: "WIFI_INDOOR", serial_number: "s1"}
          - {file_ts: 200, record_index: 0, received_timestamp: "2026-01-02 00:00:05+00", block: 20, timestamp: "2026-01-02 00:00:00+00", pub_key: "hs_a", asserted_hex: "x", asserted_lat: 1.0, asserted_lon: 2.0, device_type: "WIFI_INDOOR", serial_number: "s2"}
          - {file_ts: 300, record_index: 0, received_timestamp: "2026-01-03 00:00:05+00", block: 30, timestamp: "2026-01-03 00:00:00+00", pub_key: "hs_a", asserted_hex: "y", asserted_lat: 3.0, asserted_lon: 4.0, device_type: "WIFI_INDOOR", serial_number: "s2"}
          - {file_ts: 200, record_index: 1, received_timestamp: "2026-01-02 00:00:05+00", block: 20, timestamp: "2026-01-02 00:00:00+00", pub_key: "hs_b", asserted_hex: "z", asserted_lat: 5.0, asserted_lon: 6.0, device_type: "WIFI_OUTDOOR", serial_number: "s3"}
    expect:
      rows:
        - {pub_key: "hs_a", asserted_hex: "x", asserted_lat: 1.0, asserted_lon: 2.0, device_type: "WIFI_INDOOR", valid_from: "2026-01-01 00:00:00+00", block: 10, file_ts: 100, record_index: 0}
        - {pub_key: "hs_a", asserted_hex: "y", asserted_lat: 3.0, asserted_lon: 4.0, device_type: "WIFI_INDOOR", valid_from: "2026-01-03 00:00:00+00", block: 30, file_ts: 300, record_index: 0}
        - {pub_key: "hs_b", asserted_hex: "z", asserted_lat: 5.0, asserted_lon: 6.0, device_type: "WIFI_OUTDOOR", valid_from: "2026-01-02 00:00:00+00", block: 20, file_ts: 200, record_index: 1}

  - name: assertions_start_on_device_type_and_unasserted
    model: mobile_hotspot_assertions
    description: >
      First run. hs_a starts unasserted (null hex), is asserted at X, then
      changes device type at X. Each is its own row: a null hex is compared
      with `is distinct from`, so asserting counts, and a device type change
      counts even though the hex is unchanged.
    overrides:
      macros:
        is_incremental: false
    given:
      - input: source('chain', 'mobile_hotspot_history')
        rows:
          - {file_ts: 100, record_index: 0, received_timestamp: "2026-01-01 00:00:05+00", block: 10, timestamp: "2026-01-01 00:00:00+00", pub_key: "hs_a", asserted_hex: null, asserted_lat: null, asserted_lon: null, device_type: "WIFI_INDOOR"}
          - {file_ts: 200, record_index: 0, received_timestamp: "2026-01-02 00:00:05+00", block: 20, timestamp: "2026-01-02 00:00:00+00", pub_key: "hs_a", asserted_hex: "x", asserted_lat: 1.0, asserted_lon: 2.0, device_type: "WIFI_INDOOR"}
          - {file_ts: 300, record_index: 0, received_timestamp: "2026-01-03 00:00:05+00", block: 30, timestamp: "2026-01-03 00:00:00+00", pub_key: "hs_a", asserted_hex: "x", asserted_lat: 1.0, asserted_lon: 2.0, device_type: "WIFI_OUTDOOR"}
    expect:
      rows:
        - {pub_key: "hs_a", asserted_hex: null, asserted_lat: null, asserted_lon: null, device_type: "WIFI_INDOOR", valid_from: "2026-01-01 00:00:00+00", block: 10, file_ts: 100, record_index: 0}
        - {pub_key: "hs_a", asserted_hex: "x", asserted_lat: 1.0, asserted_lon: 2.0, device_type: "WIFI_INDOOR", valid_from: "2026-01-02 00:00:00+00", block: 20, file_ts: 200, record_index: 0}
        - {pub_key: "hs_a", asserted_hex: "x", asserted_lat: 1.0, asserted_lon: 2.0, device_type: "WIFI_OUTDOOR", valid_from: "2026-01-03 00:00:00+00", block: 30, file_ts: 300, record_index: 0}

  - name: assertions_drop_redelivered_rows
    model: mobile_hotspot_assertions
    description: >
      First run. icicle re-commits a batch after a crash, so the move to Y
      arrives twice with the same (file_ts, record_index). It counts once: the
      copy repeats the hex of the row before it.
    overrides:
      macros:
        is_incremental: false
    given:
      - input: source('chain', 'mobile_hotspot_history')
        rows:
          - {file_ts: 100, record_index: 0, received_timestamp: "2026-01-01 00:00:05+00", block: 10, timestamp: "2026-01-01 00:00:00+00", pub_key: "hs_a", asserted_hex: "x", asserted_lat: 1.0, asserted_lon: 2.0, device_type: "WIFI_INDOOR"}
          - {file_ts: 200, record_index: 3, received_timestamp: "2026-01-02 00:00:05+00", block: 20, timestamp: "2026-01-02 00:00:00+00", pub_key: "hs_a", asserted_hex: "y", asserted_lat: 3.0, asserted_lon: 4.0, device_type: "WIFI_INDOOR"}
