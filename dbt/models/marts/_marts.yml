version: 2

# Every mart declares two things: the schema it belongs to (in the model's own
# config -- the schema of the data it summarises, not a shared `analytics`
# bucket) and its grain, as a test. These are the assertions that catch a
# source schema change turning a rollup into a fan-out: if an upstream change
# splits what used to be one row per key, the grain test fails loudly instead of
# every downstream count quietly doubling.

models:
  - name: enabled_carriers_inventory
    description: >
      Current carrier enablement per hotspot -- which carriers are turned on,
      which are in demand-sampling, and the firmware that reported it. One row
      per hotspot, being its latest report; the full history is beside it in
      `hotspots.enabled_carriers_history`.

      Columns track the source's, including any added upstream
      (`on_schema_change='append_new_columns'`), so this is deliberately not an
      exhaustive column list. Only the grain and the fields a consumer joins on
      are pinned here.
    columns:
      - name: hotspot_pubkey
        description: The grain. One row per hotspot.
        tests: [not_null, unique]
      - name: received_timestamp
        description: >
          When ingest received the winning report. Authoritative clock, and the
          source's partition key -- the incremental watermark is built on it.
        tests: [not_null]
      - name: timestamp
        description: >
          Clock supplied by the reporting device: the moment whose state this
          row describes. Decides which report wins within a hotspot, and is not
          to be used as a watermark -- see the model's header.
        tests: [not_null]
      - name: enabled_carriers
        description: >
          array(varchar). Nullable, and a null is not an empty array: absent
          means the report carried no list, empty means it carried one with
          nothing in it.
      - name: sampling_enabled_carriers
        description: array(varchar). Carriers in a demand-sampling window. Nullable, as above.
      - name: file_ts
        description: Ingest file the winning row came from.
        tests: [not_null]
      - name: record_index
        description: Offset of the winning record within that file.
        tests: [not_null]

  - name: speedtest_averages
    description: >
      Rolling speedtest average per hotspot, one row per speedtest report: the
      hotspot's newest (up to) `speedtest_average_max_samples` speedtests within
      `speedtest_average_window_hours` before and including that report,
      averaged. Facts only -- no tier, multiplier or validity; deciding what
      counts as a good average is the reader's job.

      The replacement for the `hotspots.speedtest_avgs` /
      `invalid_speedtest_avgs` tables mobile-verifier writes. The oracle keeps
      writing those during a transition period, so the two can be compared on
      live data.

      Starts with reports from `speedtest_averages_start` (2026-11-01);
      earlier averages are in the verifier's `speedtest_avgs` tables.

      Append-only: each run inserts averages for new reports and never
      rewrites a row, so every run commits an Iceberg `append` snapshot that
      streaming readers (helium-iceberg's stream poller, Spark Structured
      Streaming) can follow.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [hotspot_pubkey, timestamp]
    columns:
      - name: hotspot_pubkey
        tests: [not_null]
      - name: timestamp
        description: >
          Device-reported time of the speedtest report this average is for --
          the newest sample in the window, NOT when the average was calculated.
          Together with hotspot_pubkey, the grain. Partition key, by day.
        tests: [not_null]
      - name: upload_speed_avg_bps
        description: Mean upload speed of the samples, bytes per second, truncated.
        tests: [not_null]
      - name: download_speed_avg_bps
        description: Mean download speed of the samples, bytes per second, truncated.
        tests: [not_null]
      - name: latency_avg_ms
        description: Mean latency of the samples, milliseconds, truncated.
        tests: [not_null]
      - name: sample_count
        description: >
          How many speedtests were averaged, 1 to
          `speedtest_average_max_samples`. Never 0 -- the report itself is
          always a sample. A low count is a thin average; weigh it accordingly.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: "{{ var('speedtest_average_max_samples') }}"
      - name: speedtests
        description: >
          array(row(upload_speed_bps, download_speed_bps, latency_ms,
          timestamp)), newest first. The samples behind the averages; the first
          element's timestamp equals the row's.

  - name: mobile_hotspot_assertions
    description: >
      One row per assertion of each mobile hotspot: the chain time
      (`valid_from`) it was asserted at a new cell or changed device type, and
      the cell, its center and the device type. Each row holds until the
      hotspot's next row; `valid_to` is that next row's `valid_from`, computed
      at read time with `lead(valid_from) over (partition by pub_key order by
      valid_from, block, file_ts, record_index)`.

      Append-only, so it can be streamed: each run appends only new
      assertions. See the model's header.
    tests:
      # One row per chain update that started an assertion.
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [file_ts, record_index]
    columns:
      - name: pub_key
        description: Hotspot key.
        tests: [not_null]
      - name: asserted_hex
        description: Asserted resolution-12 H3 cell. Null while unasserted.
      - name: asserted_lat
        description: Center of `asserted_hex`, degrees, computed by icicle.
      - name: asserted_lon
        description: Center of `asserted_hex`, degrees, computed by icicle.
      - name: device_type
        description: "`WIFI_INDOOR`, `WIFI_OUTDOOR`, `WIFI_DATA_ONLY`."
        tests: [not_null]
      - name: valid_from
        description: Chain time the assertion took effect.
        tests: [not_null]
      - name: block
        description: Chain block of the update; first tie-breaker after `valid_from`.
        tests: [not_null]
      - name: file_ts
        description: Ingest file of the update; with `record_index`, its identity.
        tests: [not_null]
      - name: record_index
        tests: [not_null]
      - name: received_timestamp
        description: When ingest saw the update. The incremental watermark only.
        tests: [not_null]

  - name: heartbeat_locations
    description: >
      Each valid wifi heartbeat as the hotspot reported it, beside the
      assertion in effect when it arrived (`received_timestamp`) and the
      distance between them, in meters, measured as mobile-verifier measures
      `distance_to_asserted`. Facts only: no fix-age limit, distance bands or
      trust score; eligibility models apply those.

      Append-only, so it can be streamed: each run appends heartbeats not
      measured yet, once they are `heartbeat_locations_settle_minutes` old,
      and never rewrites a row. See the model's header.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [hotspot_pubkey, received_timestamp]
    columns:
      - name: received_timestamp
        description: When ingest received the heartbeat. Partition key and watermark.
        tests: [not_null]
      - name: hotspot_pubkey
        tests: [not_null]
      - name: heartbeat_timestamp
        description: Device clock.
        tests: [not_null]
      - name: heartbeat_lat
        description: The heartbeat's own reported latitude.
        tests: [not_null]
      - name: heartbeat_lon
        description: The heartbeat's own reported longitude.
        tests: [not_null]
      - name: location_validation_timestamp
        description: >
          When that location was validated; readers judge fix age from it.
          Null when the device sent none.
      - name: location_source
        description: >
          `asserted`, `gps`, `skyhook` or `unknown`. `asserted` means the
          device reported its asserted location, so its distance is about 0 by
          construction.
        tests: [not_null]
      - name: asserted_hex
        description: >
          The assertion in effect at `received_timestamp`. Null when the
          hotspot has no assertion period covering it yet, or was unasserted.
      - name: asserted_lat
        description: Center of `asserted_hex`, from icicle.
      - name: asserted_lon
        description: Center of `asserted_hex`, from icicle.
      - name: distance_to_asserted
        description: >
          Meters, rounded, from the heartbeat's resolution-12 cell center to the
          asserted cell's center (h3o's haversine and earth radius). Null when
          there is no assertion.

  - name: offload_eligibility_history
    description: >
      Carrier offload eligibility over time: one row each time a hotspot's
      failing reasons change, or a location low run starts or ends (so the
      latest row always shows whether a low run is open). `reasons` lists
      every rule failing at `changed_at` (`no_heartbeats`, `location`,
      `no_recent_speedtest`, `below_floor`); empty means eligible. Rules come
      from the seeds `offload_heartbeat_rules` and `offload_speedtest_floors`,
      each row in effect from its date. Covers every asserted WIFI_INDOOR or
      WIFI_OUTDOOR hotspot.

      Append-only, so it can be streamed: each run judges the moments since the
      last run, up to where both inputs are complete, and appends only changes.
      Any split of the work into runs writes the same rows as one run. Each
      hotspot's status starts at the first judged moment or its current
      assertion, whichever is later. See the model's header.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [hotspot_pubkey, changed_at]
    columns:
      - name: hotspot_pubkey
        tests: [not_null]
      - name: changed_at
        description: >
          When the status took effect: a heartbeat, a speedtest average, a
          limit running out, a rule taking effect, or the hotspot's first
          judged moment. Partition key and watermark.
        tests: [not_null]
      - name: eligible
        description: True when `reasons` is empty.
        tests: [not_null]
      - name: reasons
        description: array(varchar), in a fixed order; empty when eligible.
        tests: [not_null]
      - name: location_low_since
        description: >
          When the current location low run began, while the latest heartbeat
          fails the location check; null otherwise. Set before the run reaches
          its limit, so a row can be eligible with a low run open.
      - name: last_heartbeat_at
        description: The latest valid heartbeat at `changed_at`.
      - name: last_average_at
        description: >
          The latest speedtest average's report time at `changed_at`, while it
          is within the 48-hour window; null once it is too old to count.
      - name: speedtest_floor_from
        description: The active floor in effect at `changed_at`, by its start; null before the first.

  - name: offload_eligibility
    description: >
      Current carrier offload eligibility, one row per asserted wifi hotspot:
      its latest row in `offload_eligibility_history`, plus whether its latest
      speedtest average meets the bar for submitting a new hotspot. A snapshot
      rebuilt each run, not a stream; follow the history for changes.
    columns:
      - name: hotspot_pubkey
        tests: [not_null, unique]
      - name: eligible
        tests: [not_null]
      - name: reasons
        tests: [not_null]
      - name: since
        description: When the current status took effect.
        tests: [not_null]
      - name: location_low_since
        description: >
          When the location low run began, while `location` is a failing
          reason; null otherwise.
      - name: meets_new_hotspot_bar
        description: >
          The latest average from the last 48 hours meets the `applies_to =
          'new'` floor in effect now, with enough samples. For submissions
          only; nothing removes offload by it.
        tests: [not_null]
